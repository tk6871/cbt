<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교재 필기 숨김 · 화질 개선 진행</title>
<style>body{font:17px/1.65 system-ui,sans-serif;margin:40px auto;padding:0 22px;max-width:900px;background:#0e1722;color:#e1eaf4}h1{font-size:26px}progress{width:100%;height:24px}pre{white-space:pre-wrap;background:#182636;padding:18px;border-radius:8px}a{color:#86c5ff}.muted{color:#a7bacd}</style>
<h1>필기 영향이 있는 부분만 교체</h1><p>원문14쪽 + 문제/풀이26장만 교체 · 나머지383쪽/이전 개선474장은 그대로</p><progress id="meter" max="40" value="0"></progress><p id="summary">축소한 처리 작업 시작 대기</p><pre id="details"></pre><p class="muted">5초마다 갱신합니다. 완료는 이미지 생성뿐 아니라 빌드·관련 검사·summary 기록이 모두 성공한 상태입니다. 커밋/Push는 포함하지 않습니다.</p><p><a href="night.log" target="_blank">전체 실행 로그</a> · <a href="upscale-progress.json" target="_blank">상세 진행 정보</a> · <a href="reader-restoration.json" target="_blank">교보 보기 복원 상태</a></p>
<script>async function update(){try{const load=async f=>{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});return r.ok?r.json():{}};const [n,p]=await Promise.all([load('night-status.json'),load('upscale-progress.json')]);meter.value=p.completed||0;const label=({starting:'시작 중',running:'처리 중',complete:'로컬 반영·검사 완료','failed-needs-review':'오류로 중단 · 로그 확인'})[n.status]||n.status||'시작 대기';summary.textContent=`${label} · ${p.completed||0}/${p.total||40}장`;details.textContent=JSON.stringify({상태:n.status,이미지상태:p.status,현재:p.current,완료:p.completed||0,남음:p.remaining??40,갱신:p.updatedAt||n.updatedAt,오류:n.error||p.error||null},null,2)}catch(e){summary.textContent='진행 정보를 읽지 못했습니다. 로컬 서버 실행 상태를 확인하세요.'}}update();setInterval(update,5000)</script>
