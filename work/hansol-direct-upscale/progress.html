<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교재 업스케일링 진행</title><style>body{max-width:900px;margin:40px auto;padding:0 20px;background:#0e1724;color:#e5edf8;font:17px/1.7 system-ui}h1{font-size:26px}progress{width:100%;height:30px}strong{font-size:32px;color:#81d9c2}dl{display:grid;grid-template-columns:170px 1fr}dt{color:#9dabc0}dd{margin:0}pre{white-space:pre-wrap;background:#172435;padding:15px;border-radius:8px;font-size:13px}a{color:#8dc6ff}</style><h1>교재397쪽 업스케일링</h1><p>기존 Real-ESRGAN · 4배 처리 → 2배 적용 · 원본과 좌표 유지</p><strong id="count">확인 중…</strong><progress id="bar" max="397" value="0"></progress><dl id="details"></dl><p id="notice">5초마다 자동 갱신합니다. 화면을 닫아도 실행 중인 처리에는 영향을 주지 않습니다. Mac을 잠자기/종료하면 처리가 멈추거나 지연될 수 있습니다.</p><pre id="raw"></pre><p><a href="/">CBT 돌아가기</a></p><script>async function update(){try{const r=await fetch('./progress.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('진행 파일을 아직 읽지 못했습니다.');const p=await r.json();document.querySelector('#count').textContent=`${p.completed} / ${p.total}쪽 · ${Math.round(p.completed/p.total*100)}%`;document.querySelector('#bar').value=p.completed;const names={'running':'이미지 처리 중','partial':'일부 완료','complete':'이미지 생성 완료','verifying-release':'최종 검사·빌드 중','finished-local-release':'로컬 적용·검사 완료','interrupted':'처리 중단 · 로그 확인','release-verification-failed':'이미지 완료, 마감 검사 실패'};const values=[['상태',names[p.status]||p.status],['현재 쪽',p.currentPage||'—'],['남은 시간(추정)',p.estimatedRemainingSeconds?Math.ceil(p.estimatedRemainingSeconds/60)+'분':'산출 중 또는 완료'],['최근 갱신',p.updatedAt],['배포','로컬 처리입니다. GitHub 커밋·Push와 별개입니다.']];const dl=document.querySelector('#details');dl.replaceChildren();for(const [a,b] of values){for(const [tag,s] of [['dt',a],['dd',b]]){const el=document.createElement(tag);el.textContent=s;dl.append(el);}}document.querySelector('#raw').textContent=JSON.stringify(p,null,2);}catch(e){document.querySelector('#raw').textContent=String(e);}}update();setInterval(update,5000);</script></html>
