<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8d2745">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="보석관 CBT">
  <meta name="description" content="보석감정사와 귀금속가공 자격 기출문제 학습관">
  <title>보석·귀금속 학습관</title>
  <link rel="manifest" href="jewelry.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="modern/cbt.css?v=461">
  <script>
    window.CBT_APP_SPACE = 'jewelry';
    document.documentElement.dataset.space = 'jewelry';
    try {
      const mode = localStorage.getItem('unified-cbt-theme') || 'dark';
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      const visualStyle = localStorage.getItem('unified-cbt-visual-style');
      document.documentElement.dataset.visualStyle = visualStyle === 'simpsons' || visualStyle === 'sunjae' ? visualStyle : 'default';
      document.documentElement.dataset.dynamicUi = localStorage.getItem('unified-cbt-dynamic-ui') === 'false' ? 'off' : 'on';
    } catch (error) {}
  </script>
  <style>
    html,body,#next-app{min-height:100%}html,body{margin:0;background:var(--bg,#f7f3f4)}
    .next-boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;color:#352029;font:600 14px "Nanum Gothic",system-ui,sans-serif}
    .next-boot span{width:52px;height:52px;border-radius:16px;color:#fff;background:linear-gradient(145deg,#b83d63,#79223d);display:grid;place-items:center;box-shadow:0 12px 28px rgba(141,39,69,.25);font-size:11px}
    .next-boot small{color:#8b737c;font-weight:500}
  </style>
</head>
<body>
  <div id="next-app">
    <div class="next-boot"><span>GEM</span><strong>보석관을 준비하고 있습니다.</strong><small>보석·귀금속 문제를 불러오는 중입니다.</small></div>
  </div>
  <script src="cloud-config.js?v=200"></script>
  <script src="data/jewelry.js?v=255"></script>
  <script src="data/changelog.js?v=255"></script>
  <script src="data/changelog-vue.js?v=461"></script>
  <script type="module" src="modern/cbt.js?v=461"></script>
  <script type="module">
    if (window.CBT_CLOUD_CONFIG?.enabled) import('./modern/visitor.js?v=255');
  </script>
</body>
</html>
