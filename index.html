<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1268d3">
  <meta name="description" content="공조냉동기계·산업안전·에너지관리·설비보전산업기사 기출문제 학습과 모의시험">
  <title>산업기사 통합 CBT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="modern/cbt.css?v=350">
  <script>
    window.CBT_APP_SPACE = 'industrial';
    try {
      const mode = localStorage.getItem('unified-cbt-theme') || 'dark';
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      const visualStyle = localStorage.getItem('unified-cbt-visual-style');
      document.documentElement.dataset.visualStyle = visualStyle === 'simpsons' || visualStyle === 'sunjae' ? visualStyle : 'default';
      document.documentElement.dataset.dynamicUi = localStorage.getItem('unified-cbt-dynamic-ui') === 'false' ? 'off' : 'on';
    } catch (error) {}
  </script>
  <style>
    html,body,#next-app{min-height:100%}html,body{margin:0;background:var(--bg,#f2f6fb)}
    .next-boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;color:#10243f;font:600 14px "Nanum Gothic",system-ui,sans-serif}
    .next-boot span{width:52px;height:52px;border-radius:16px;color:#fff;background:linear-gradient(145deg,#1683eb,#0853b3);display:grid;place-items:center;box-shadow:0 12px 28px rgba(18,104,211,.25);font-size:12px}
    .next-boot small{color:#71839a;font-weight:500}
  </style>
</head>
<body>
  <div id="next-app">
    <div class="next-boot"><span>CBT</span><strong>산업기사 CBT를 준비하고 있습니다.</strong><small>문제와 학습 기록을 안전하게 불러오는 중입니다.</small></div>
  </div>
  <script src="cloud-config.js?v=200"></script>
  <script src="data/catalog-index.js?v=350"></script>
  <script src="data/catalog-bootstrap.js?v=350"></script>
  <script src="data/changelog.js?v=255"></script>
  <script src="data/changelog-vue.js?v=350"></script>
  <script type="module">
    import(/* @vite-ignore */ (window.CBT_DISPLAY_MODE === 'mobile' ? './modern/mobile.js?v=350' : './modern/cbt.js?v=350'));
  </script>
  <script type="module">
    if (window.CBT_CLOUD_CONFIG?.enabled) import('./modern/visitor.js?v=255');
  </script>
</body>
</html>
