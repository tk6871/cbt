<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT 작업 실시간 로그</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111827;color:#e5e7eb}
  body{margin:0;padding:24px;max-width:1300px;margin-inline:auto}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#bbc6d7}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;background:#223049;color:#fff;border:1px solid #64748b;border-radius:8px;padding:8px 12px}
  #state{font-size:19px;font-weight:700;color:#7dd3fc}#connection{color:#94a3b8;font-size:14px}#steps{display:flex;gap:8px;flex-wrap:wrap;padding:0;list-style:none}
  #steps li{border:1px solid #46556e;border-radius:8px;padding:7px 10px;font-size:14px}.passed{color:#86efac}.failed,.stopped{color:#fca5a5}.running{color:#7dd3fc}
  pre{background:#080e1a;border:1px solid #334155;border-radius:10px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;height:55vh;min-height:240px;overflow:auto;font:14px/1.65 ui-monospace,monospace}
  #run,#note{font-size:13px;overflow-wrap:anywhere}a{color:#7dd3fc}
</style>
<h1>CBT 작업 실시간 로그</h1>
<p>2초마다 자동 갱신 · 새로운 배치가 시작되면 최신 실행으로 전환합니다.<br>이 화면은 자동 검사 로그입니다. 이미지 자체 잘림·가림의 직접 검수 완료를 뜻하지 않습니다.</p>
<div id="state" role="status">불러오는 중…</div>
<div id="run"></div>
<ul id="steps" aria-label="단계별 상태"></ul>
<div class="bar">
  <label>로그 <select id="step"><option value="auto">현재 / 마지막 단계 자동</option><option value="run">전체 실행</option><option value="image-ledger">이미지 연결·해시</option><option value="question-structure">문제 구조</option><option value="typecheck">타입 검사</option><option value="web-build">웹 빌드</option><option value="pwa">PWA 검사</option><option value="browser-images">PC 화면 검사</option></select></label>
  <label><input type="checkbox" id="follow" checked> 최신 줄 따라가기</label>
  <button id="refresh">지금 갱신</button>
  <span id="connection"></span>
</div>
<div id="note"></div>
<pre id="log" tabindex="0" aria-label="실시간 로그"></pre>
<script>
const $ = id => document.getElementById(id);
const states = { starting:'준비 중', running:'진행 중', passed:'통과', failed:'실패', stopped:'중지' };
const names = { 'image-ledger':'이미지 연결·해시', 'question-structure':'문제 구조', typecheck:'타입 검사', 'web-build':'웹 빌드', pwa:'PWA 검사', 'browser-images':'화면 검사' };
let busy=false, timer;
async function refresh(){
  if(busy) return;
  busy=true;clearTimeout(timer);
  try{
    const response=await fetch('/api/log?step='+encodeURIComponent($('step').value),{cache:'no-store',signal:AbortSignal.timeout(5000)});
    if(!response.ok) throw new Error('연결 오류');
    const data=await response.json();
    const s=data.status;
    $('state').textContent=s ? '자동 검사: '+(states[s.state]||s.state)+(data.processAlive===false?' — 실행 프로세스 없음, 중단 여부 확인 필요':'') : '아직 실행 기록이 없습니다';
    $('state').className=s?.state||'';
    $('run').textContent=data.run?'실행: '+data.run:'';
    const signature=JSON.stringify(s?.steps||[]);
    if($('steps').dataset.signature!==signature){
      $('steps').replaceChildren(...(s?.steps||[]).map(step=>{const li=document.createElement('li');li.className=step.state;li.textContent=(names[step.name]||step.name)+' · '+(states[step.state]||step.state);return li;}));
      $('steps').dataset.signature=signature;
    }
    // textContent, never HTML: log output may contain arbitrary text.
    const text=(data.log||'아직 이 단계의 로그가 없습니다.').replace(/\x1b\[[0-?]*[ -/]*[@-~]/g,'');
    if($('log').textContent!==text){$('log').textContent=text;if($('follow').checked)$('log').scrollTop=$('log').scrollHeight;}
    $('note').textContent=[s?.error||'',data.truncated?'큰 로그는 마지막 128KB만 표시합니다.':'',s?.finishedAt?'종료: '+new Date(s.finishedAt).toLocaleString():''].filter(Boolean).join(' · ');
    $('connection').textContent='연결됨 · '+new Date(data.checkedAt).toLocaleTimeString()+' 갱신';
  }catch{ $('connection').textContent='연결 끊김 — 마지막 표시 유지, 자동 재시도 중'; }
  finally{busy=false;timer=setTimeout(refresh,2000);}
}
$('step').addEventListener('change',refresh);
$('refresh').addEventListener('click',refresh);
$('follow').addEventListener('change',()=>{if($('follow').checked)$('log').scrollTop=$('log').scrollHeight;});
refresh();
</script>
</html>
