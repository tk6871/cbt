<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1268d3">
  <meta name="description" content="공조냉동기계산업기사, 산업안전산업기사, 에너지관리산업기사, 설비보전산업기사 통합 CBT">
  <title>산업기사 통합 CBT · 새 화면</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="modern/cbt.css?v=195">
  <script>
    try {
      const mode = localStorage.getItem('unified-cbt-theme') || 'system';
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (error) {}
  </script>
  <style>
    html,body,#next-app{min-height:100%}
    body{margin:0;background:#f2f6fb}
    .next-boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:12px;color:#10243f;font:600 14px system-ui,sans-serif}
    .next-boot span{width:52px;height:52px;border-radius:16px;color:#fff;background:linear-gradient(145deg,#1683eb,#0853b3);display:grid;place-items:center;box-shadow:0 12px 28px rgba(18,104,211,.25);font-size:12px}
    .next-boot small{color:#71839a;font-weight:500}
  </style>
</head>
<body>
  <div id="next-app">
    <div class="next-boot"><span>CBT</span><strong>새 CBT 화면을 준비하고 있습니다.</strong><small>기존 학습 기록을 안전하게 불러오는 중입니다.</small></div>
  </div>
  <script src="cloud-config.js"></script>
  <script src="data/hvac.js"></script>
  <script src="data/safety.js"></script>
  <script src="data/energy.js"></script>
  <script src="data/energy-engineer.js"></script>
  <script src="data/maintenance.js"></script>
  <script type="module" src="modern/cbt.js?v=195"></script>
  <script type="module">
    if (window.CBT_CLOUD_CONFIG?.enabled) import('./modern/visitor.js?v=195');
  </script>
</body>
</html>
