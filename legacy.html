<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b63ce">
  <meta name="description" content="산업기사 통합 CBT 이전 버전">
  <title>산업기사 통합 CBT · 이전 버전</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="app.css?v=194">
  <script>
    try {
      const mode = localStorage.getItem('unified-cbt-theme') || 'system';
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (error) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-screen"><div class="boot-mark">CBT</div><strong>산업기사 통합 CBT</strong><span>이전 버전을 준비하고 있습니다.</span></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="cloud-config.js?v=194"></script>
  <script src="data/hvac.js?v=194"></script>
  <script src="data/safety.js"></script>
  <script src="data/energy.js"></script>
  <script src="data/energy-engineer.js"></script>
  <script src="data/maintenance.js"></script>
  <script src="data/jewelry.js?v=194"></script>
  <script src="data/changelog.js?v=194"></script>
  <script src="app.js?v=194"></script>
  <script type="module">
    if (window.CBT_CLOUD_CONFIG?.enabled) import('./modern/visitor.js?v=200');
  </script>
</body>
</html>
