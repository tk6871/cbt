<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#22262a">
  <title>CBT 공학용 계산기</title>
  <link rel="stylesheet" href="calculator.css?v=190">
</head>
<body>
  <main class="calculator-case" aria-label="공학용 계산기">
    <header class="calculator-brand">
      <div>
        <strong>CBT SCIENTIFIC</strong>
        <span>fx-570ES PLUS STYLE</span>
      </div>
      <div class="model-copy">
        <b>NATURAL-V.P.A.M.</b>
        <small>TWO WAY POWER</small>
      </div>
    </header>

    <section class="lcd-bezel">
      <div class="lcd-status">
        <span id="shiftStatus">S</span>
        <span id="alphaStatus">A</span>
        <span id="memoryStatus">M</span>
        <b id="angleStatus">DEG</b>
        <i>Math</i>
      </div>
      <input id="calculatorInput" aria-label="계산식" autocomplete="off" inputmode="decimal" spellcheck="false">
      <output id="calculatorResult" aria-live="polite">0</output>
    </section>

    <div class="top-key-grid">
      <button class="modifier shift-key" data-action="shift"><span>SHIFT</span></button>
      <button class="modifier alpha-key" data-action="alpha"><span>ALPHA</span></button>
      <button class="dark-key" data-action="angle"><small>SETUP</small><span>MODE</span></button>
      <button class="dark-key" data-action="memory-clear"><small>CLR</small><span>MC</span></button>
      <button class="dark-key" data-action="clear"><small>OFF</small><span>ON</span></button>
    </div>

    <section class="replay-section">
      <button class="dark-key" data-value="abs("><small>CALC</small><span>Abs</span></button>
      <button class="dark-key" data-value="sqrt("><small>∫</small><span>√</span></button>
      <div class="replay-pad" aria-label="입력 위치 이동">
        <span>REPLAY</span>
        <button data-action="caret-left" aria-label="왼쪽">◀</button>
        <button data-action="caret-up" aria-label="위">▲</button>
        <button data-action="caret-right" aria-label="오른쪽">▶</button>
        <button data-action="caret-down" aria-label="아래">▼</button>
      </div>
      <button class="dark-key" data-action="memory-recall"><small>STO</small><span>RCL</span></button>
      <button class="dark-key" data-action="memory-add"><small>M−</small><span>M+</span></button>
    </section>

    <section class="science-grid">
      <button data-value="^(-1)" data-shift="!" data-shift-label="x!"><small>x!</small><span>x⁻¹</span></button>
      <button data-value="combinations(" data-shift="permutations(" data-shift-label="nPr"><small>nPr</small><span>nCr</span></button>
      <button data-value="^2" data-shift="sqrt(" data-shift-label="√"><small>√</small><span>x²</span></button>
      <button data-value="^" data-shift="nthRoot(" data-shift-label="ˣ√"><small>ˣ√</small><span>xʸ</span></button>
      <button data-value="log(" data-shift="10^(" data-shift-label="10ˣ"><small>10ˣ</small><span>log</span></button>

      <button data-value="ln(" data-shift="e^(" data-shift-label="eˣ"><small>eˣ</small><span>ln</span></button>
      <button data-value="-" data-shift="neg(" data-shift-label="neg"><small>neg</small><span>(−)</span></button>
      <button data-value="pi" data-shift="e" data-shift-label="e"><small>e</small><span>π</span></button>
      <button data-value="sqrt(" data-shift="cbrt(" data-shift-label="³√"><small>³√</small><span>√</span></button>
      <button data-value="sin(" data-shift="asin(" data-shift-label="sin⁻¹"><small>sin⁻¹</small><span>sin</span></button>

      <button data-value="cos(" data-shift="acos(" data-shift-label="cos⁻¹"><small>cos⁻¹</small><span>cos</span></button>
      <button data-value="tan(" data-shift="atan(" data-shift-label="tan⁻¹"><small>tan⁻¹</small><span>tan</span></button>
      <button data-value="(" data-shift="[" data-shift-label="["><small>[</small><span>(</span></button>
      <button data-value=")" data-shift="]" data-shift-label="]"><small>]</small><span>)</span></button>
      <button data-value="," data-shift=";" data-shift-label=";"><small>;</small><span>,</span></button>

      <button data-action="fraction-toggle"><small>a b/c</small><span>S⇔D</span></button>
      <button data-value="*" data-shift="/" data-shift-label="÷"><small>÷</small><span>×</span></button>
      <button data-value="E" data-shift="*10^(" data-shift-label="×10ˣ"><small>×10ˣ</small><span>ENG</span></button>
      <button data-value="ans" data-shift="M" data-shift-label="M"><small>M</small><span>Ans</span></button>
      <button data-action="history"><small>HISTORY</small><span>↑↓</span></button>
    </section>

    <section class="number-grid">
      <button class="number-key" data-value="7"><span>7</span></button>
      <button class="number-key" data-value="8"><span>8</span></button>
      <button class="number-key" data-value="9"><span>9</span></button>
      <button class="edit-key" data-action="backspace"><span>DEL</span></button>
      <button class="edit-key" data-action="clear"><span>AC</span></button>

      <button class="number-key" data-value="4"><span>4</span></button>
      <button class="number-key" data-value="5"><span>5</span></button>
      <button class="number-key" data-value="6"><span>6</span></button>
      <button class="operator-key" data-value="*"><span>×</span></button>
      <button class="operator-key" data-value="/"><span>÷</span></button>

      <button class="number-key" data-value="1"><span>1</span></button>
      <button class="number-key" data-value="2"><span>2</span></button>
      <button class="number-key" data-value="3"><span>3</span></button>
      <button class="operator-key" data-value="+"><span>+</span></button>
      <button class="operator-key" data-value="-"><span>−</span></button>

      <button class="number-key" data-value="0"><span>0</span></button>
      <button class="number-key" data-value="."><span>·</span></button>
      <button class="number-key" data-value="E"><span>×10ˣ</span></button>
      <button class="number-key" data-value="ans"><span>Ans</span></button>
      <button class="equals-key" data-action="equals"><span>=</span></button>
    </section>

    <aside id="historyPanel" class="history-panel" hidden>
      <div><strong>계산 기록</strong><button data-action="history-clear">지우기</button></div>
      <ol id="historyList"></ol>
    </aside>

    <footer>독립형 CBT 공학용 계산기 · DEG/RAD · SHIFT · MEMORY</footer>
  </main>
  <script src="vendor/math.js?v=190"></script>
  <script src="calculator.js?v=190"></script>
</body>
</html>
