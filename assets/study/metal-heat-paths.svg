<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" role="img" aria-labelledby="title desc">
 <title id="title">탄소강의 시간에 따른 온도 변화</title>
 <desc id="desc">A는 급냉 후 A₁ 아래로 다시 가열한다. B는 공기 중에서, C는 가열로 안에서 식힌다. 경로를 비교하는 개념도다.</desc>
 <rect width="620" height="270" rx="8" fill="#fffdf8"/>
 <g fill="none" stroke-linecap="round"><path d="M62 24V219H580" stroke="#374957" stroke-width="2"/>
 <path d="M62 84H567" stroke="#6c777e" stroke-dasharray="5 5"/>
 <path d="M85 43L100 198H171L203 114H260L288 195" stroke="#a13d26" stroke-width="4"/>
 <path d="M85 43Q147 132 323 192" stroke="#20736e" stroke-width="4"/>
 <path d="M85 43Q333 64 494 176" stroke="#365d9b" stroke-width="4"/></g>
 <g fill="#20323c" font-family="sans-serif" font-size="17"><text x="12" y="30">온도</text><text x="15" y="89">A₁</text><text x="514" y="247">시간 →</text>
 <text x="195" y="140" fill="#a13d26">A · 재가열</text><text x="328" y="201" fill="#20736e">B · 공기 중</text><text x="489" y="162" fill="#365d9b">C · 로 안</text>
 <text x="65" y="247" font-size="14">온도 이력을 비교하는 그림 (축척 없음)</text></g>
</svg>
