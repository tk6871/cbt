<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>냉동 중간고사 전체 범위 중복 검토</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#f1f5f9;color:#172033}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px}p{line-height:1.65}a{color:#1769aa}button,input,select{font:inherit;padding:10px;border:1px solid #94a3b8;border-radius:8px}button{cursor:pointer}button[aria-pressed=true]{background:#165caa;color:white}button:disabled{opacity:.5;cursor:default}.summary,.controls,.pager{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.summary>div{padding:14px;background:#fff;border:1px solid #cbd5e1;border-radius:12px}.summary b{display:block;font-size:25px}.controls{margin:20px 0}input[type=search]{min-width:250px;flex:1}.note{background:#fff7dc;border-left:4px solid #d08b12;padding:12px}.entry{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:18px;margin:16px 0;overflow-wrap:anywhere}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.question{border:1px solid #cbd5e1;padding:16px;border-radius:10px;min-width:0}.question h3{font-size:17px;margin:0 0 10px}.question ol{padding-left:24px}.question li{padding:5px 4px;white-space:pre-wrap}.correct{background:#e0f4e9;color:#164d32;font-weight:700}.meta{color:#56657a;font-size:14px}.badge{display:inline-block;background:#e4edfb;color:#1e4b89;border-radius:6px;padding:3px 7px;margin:0 6px 5px 0}.warning{background:#fff0d0;color:#714800}.source-image{max-width:100%;height:auto;display:block;background:white;margin:12px 0;cursor:zoom-in}.pager{justify-content:center;margin:20px 0}details>summary{cursor:pointer;padding:8px 0}dialog{max-width:96vw;max-height:96vh;padding:12px}dialog img{display:block;max-width:90vw;max-height:84vh;object-fit:contain;background:white}dialog::backdrop{background:#000a}#error{color:#a32424}
@media(prefers-color-scheme:dark){:root{background:#0c1422;color:#e5edf7}.summary>div,.entry,.question{background:#152236;border-color:#40516a}.meta{color:#b0bfd4}.note{background:#302819;color:#f9e9be}a{color:#8ac5ff}.correct{background:#1b4538;color:#c3f5d9}.badge{background:#243e65;color:#c6dfff}.warning{background:#473718;color:#ffe2a4}}
@media(max-width:780px){main{padding:14px}.comparison{grid-template-columns:1fr}}
</style></head><body><main>
<a href="../">← CBT로</a><h1>냉동 중간고사 전체 범위 중복 검토</h1>
<p>일반 기출과 안전관리 전체 범위를 확인한 검수 대장입니다. 원본 문제·정답·이미지·과거 풀이 ID는 삭제하지 않고, 같은 반복만 새 출제에서 최신 회차 대표로 묶습니다.</p>
<div id="summary" class="summary"></div><p id="limits" class="note"></p>
<div class="controls" aria-label="검수 보기"><button data-view="groups" aria-pressed="true">통합 묶음</button><button data-view="issues" aria-pressed="false">원문 차이·정답 주의</button><button data-view="inventory" aria-pressed="false">전체 문제</button><button data-view="pairs" aria-pressed="false">전체 비교 후보</button></div>
<div class="controls"><input id="search" type="search" aria-label="문제 검색" placeholder="문제 내용·회차·문항 ID 검색"><select id="scope" aria-label="문제 범위"><option value="all">일반 + 안전 전체</option><option value="general">일반 문제</option><option value="safety">안전관리 별도</option></select><select id="decision" aria-label="검토 결과"><option value="all">모든 결과</option><option value="merge">통합 승인</option><option value="source-review">원문 확인 필요</option><option value="retain">개별 검토 후 유지</option><option value="retain-unconfirmed">미확정 유지</option></select></div>
<p id="count" role="status">검수 대장 읽는 중…</p><p id="error" role="alert"></p><div id="list"></div><div class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div>
<dialog id="zoom"><button id="close">닫기</button><img alt="원문 이미지 확대"></dialog>
</main><script type="module">
const $=id=>document.getElementById(id), el=(tag,text,className)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;};
let report,consolidation,rows,view='groups',page=0;const size=20;
const labels={merge:'통합 승인',retain:'개별 검토 후 유지','retain-unconfirmed':'미확정 유지','source-review':'원문 확인 필요'};
const title=r=>`${r.year}년 ${r.session||''} · ${r.number}번 · ${r.id}`;
const flatGroups=()=>[...consolidation.general.groups,...consolidation.safety.groups];
function question(r){
 const box=el('section',undefined,'question');box.append(el('h3',title(r)),el('p',`${r.chapter} · ${r.section}${r.safety?' · 안전 별도':''}${r.calculation?' · 계산':''}`,'meta'),el('p',r.text));
 const choices=el('ol');r.choices.forEach((text,i)=>choices.append(el('li',text,i+1===r.answer?'correct':'')));box.append(choices,el('p',`등록 정답 ${r.answer}번 · ${r.correct}`,'meta'));
 const paths=[...new Set([r.sourceImage,...r.images].filter(Boolean))];
 if(paths.length){const details=el('details');details.append(el('summary',`원문 이미지 ${paths.length}개 펼치기`));for(const path of paths){const img=el('img',undefined,'source-image');img.src=new URL('../'+path,location.href).href;img.loading='lazy';img.alt=title(r);img.addEventListener('click',()=>{$('zoom').querySelector('img').src=img.src;$('zoom').showModal();});details.append(img);}box.append(details);}
 const ids=el('details');ids.append(el('summary',`보존된 원본 ID ${r.members.length}개`),el('p',r.members.join(' · '),'meta'));box.append(ids);return box;
}
function getEntries(){
 let entries=view==='groups'?report.clusters.map(g=>({type:'group',group:g,items:report.rows.filter(r=>r.group===g.group)})):view==='issues'?report.issues.map(i=>({type:'issue',issue:i,items:i.ids.map(id=>rows.get(id))})):view==='inventory'?report.rows.map(r=>({type:'row',items:[r]})):report.pairs.map(p=>({type:'pair',pair:p,items:[rows.get(p.a),rows.get(p.b)]}));
 const query=$('search').value.trim().toLowerCase(),scope=$('scope').value,decision=$('decision').value;
 return entries.filter(e=>(scope==='all'||e.items.some(r=>r.safety===(scope==='safety')))&&(view!=='pairs'||decision==='all'||e.pair.decision===decision)&&(!query||e.items.some(r=>[title(r),r.text,...r.choices,r.chapter,r.section,...r.members].join(' ').toLowerCase().includes(query))));
}
function render(){
 const entries=getEntries();page=Math.min(page,Math.max(0,Math.ceil(entries.length/size)-1));$('list').replaceChildren();
 for(const e of entries.slice(page*size,(page+1)*size)){
  const card=el('article',undefined,'entry');
  if(e.type==='group'){
   const actual=flatGroups().find(g=>e.items.some(r=>r.members.includes(g.representative)));
   card.append(el('h2',`같은 반복 ${e.items.length}종`),el('p',e.group.reason));
   if(actual)card.append(el('p',`최신 대표: ${actual.representative} · 나왔던 회차: ${actual.occurrences.join(' / ')}`,'badge'));
  }else if(e.type==='issue')card.append(el('h2','통합하지 않은 원문 차이·등록 정답 주의'),el('p',e.issue.reason,'note'));
  else if(e.type==='pair')card.append(el('h2',`후보 #${e.pair.index} · ${labels[e.pair.decision]}`),el('p',e.pair.reason,e.pair.decision==='source-review'?'note':'meta'));
  else card.append(el('span',e.items[0].group?'검토 승인 묶음에 포함':'기존 일치 규칙 또는 독립 문제','badge'));
  const compare=el('div',undefined,'comparison');for(const r of e.items)compare.append(question(r));card.append(compare);$('list').append(card);
 }
 $('count').textContent=`${entries.length.toLocaleString()}개 결과 · 한 페이지 ${size}개 · 원본 ${report.raw}개 ID 모두 보존`;$('page').textContent=`${entries.length?page+1:0} / ${Math.ceil(entries.length/size)}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=entries.length;$('decision').hidden=view!=='pairs';
}
for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{view=b.dataset.view;page=0;for(const n of document.querySelectorAll('[data-view]'))n.setAttribute('aria-pressed',String(n===b));render();});
for(const id of ['search','scope','decision'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('close').onclick=()=>$('zoom').close();
try{
 [report,consolidation]=await Promise.all(['cooling-midterm-duplicate-review-2026-10-12.json','cooling-midterm-consolidation-2026-10-12.json'].map(async path=>{const response=await fetch(path);if(!response.ok)throw Error(`검수 파일을 불러오지 못했습니다: ${response.status}`);return response.json();}));
 rows=new Map(report.rows.map(r=>[r.id,r]));
 for(const [label,value] of [['보존 원문',report.raw],['새 일반 출제',consolidation.general.active],['안전 별도',consolidation.safety.active],['추가 통합 묶음',report.clusters.length],['주의 비교',report.issues.length]]){const n=el('div');n.append(el('b',value.toLocaleString()),el('span',label));$('summary').append(n);}
 $('limits').textContent=`전체 ${report.contentRowsReviewed}개 기존 대표(${report.raw}개 원본 ID)를 읽고 ${report.comparedPairs.toLocaleString()}쌍을 문자 비교했습니다. 상위 ${report.manualCandidatePairsReviewed}후보를 개별 검토하고 그림·수식 ${report.sourceViewsReviewed}원문을 시각 대조했습니다. 낮은 유사도 미확정 후보는 삭제하지 않습니다. 전 이미지·모든 정답 사실·법규 전수 검증이나 중복 누락 0의 보장은 아닙니다.`;render();
}catch(error){$('error').textContent=String(error);$('count').textContent='불러오기 실패';}
</script></body></html>
